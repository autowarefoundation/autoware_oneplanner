# Deployment defaults of the OnePlanner node: MODEL-AGNOSTIC.
#
# Nothing here is specific to one network. Everything a particular model dictates (tensor
# names, voxelization geometry, temporal history, horizon, input convention and the precision
# its graph tolerates) lives in `ml_package_<model>.param.yaml` NEXT TO THE MODEL FILES, the
# convention of autoware_bevfusion. The launch file loads this file first and the ml_package
# file second, so a model's values override these defaults without editing the package.
/**:
  ros__parameters:
    # -- artifacts: the directory is the deployment's, the file names the launch arguments' --
    model_path: $(var model_path)/$(var planner_onnx)
    plugins_path: ""  # planner graphs need no custom TensorRT plugins
    build_only: false

    # fp32 unless the model says otherwise: a planner graph that embeds normalization
    # statistics can exceed the fp16 range, and TensorRT clips silently rather than failing.
    precision: "fp32"

    # TensorRT builder workspace, an upper bound on the builder's scratch memory (not an
    # allocation), shared by both engines. Raise it only for a graph whose build reports
    # insufficient workspace.
    trt_workspace_mib: 4096

    # -- runtime --
    shift_x: false

    # How long the pacing sensor may stay silent before the node reports it on
    # `inference_status` (WARN, never an error). Waiting is the normal start-up state: the
    # node is regularly running before the LiDAR pipeline that paces it. An order of magnitude
    # above the 10 Hz LiDAR period, so a single dropped frame is not reported.
    input_timeout_seconds: 1.0

    # Localization publishes the acceleration beside the odometry, with the same stamp and a
    # fraction of a millisecond after it. A pass that would read it before it arrives waits for
    # it (it is read at or before the planning stamp) for at most this long, then takes the
    # latest earlier sample. 0 never waits.
    acceleration_max_wait_ms: 50.0

    # Debug only. A directory here makes the node write every host-side input tensor and every
    # output tensor of its first `dump_max_frames` inferences as raw float32 files plus a JSONL
    # manifest (stamp, ego pose and twist, shapes): what the network was actually fed.
    debug:
      dump_dir: ""
      dump_max_frames: 300

    # A localization jump larger than slack plus maximum rate times elapsed time discards the
    # ego history and the BEV cache, instead of warping across the jump.
    localization_reset:
      translation_slack_m: 2.0
      max_speed_mps: 60.0
      yaw_slack_rad: 0.35
      max_yaw_rate_rps: 2.0

    bev_feature:
      # The history itself (frames, interval, extent, tensor names) describes the network and
      # comes from the ml_package file; what is left here is host behaviour.
      interval_tolerance_seconds: 0.02
      # A history step whose LiDAR frame was dropped takes the newest map at most this much
      # older than its target: the next older scan, as the training data indexes its history.
      substitute_max_seconds: 0.2
      warmup: "wait"  # "wait" or "duplicate_current"
      max_delay_ms: 200.0
      max_future_skew_ms: 20.0
      extractor:
        engine_path: ""  # empty: <onnx stem>.engine beside the ONNX file
        onnx_path: $(var model_path)/$(var extractor_onnx)
        plugins_path: $(var tensorrt_plugins_path)
        precision: "fp16"
        cloud_capacity: 2000000

      # Postprocessing of the detection head, when the model carries one. Whether the head
      # exists, its classes, proposal count and score thresholds are the network's and come
      # from the ml_package file; these are the knobs autoware_bevfusion keeps in its own
      # deployment file, with its values.
      detection:
        # Class-agnostic circle NMS on the box centres, after the score thresholds.
        circle_nms_dist_threshold: 0.5
        # BEV-IoU NMS over the resulting objects.
        iou_nms_search_distance_2d: 10.0
        iou_nms_threshold: 0.1
        # Per head class, in the ml_package file's class_names order: a proposal whose
        # (sin, cos) norm falls below its class's floor is scored zero. The rigid vehicle
        # classes are gated, pedestrians and classes without an Autoware label are not.
        # CAR   TRUCK BUS   BICYCLE PEDESTRIAN and any further head class
        yaw_norm_thresholds: [0.3, 0.3, 0.3, 0.3, 0.0, 0.0, 0.0]
        # Area-based class remapping is off. To enable it, set all three of
        # allow_remapping_by_area_matrix, min_area_matrix and max_area_matrix (square,
        # row-major, indexed by ObjectClassification label), as autoware_bevfusion's
        # detection_class_remapper.param.yaml does.

    context:
      # Subscribe to the turn-indicator report for a model that declares the tensor. A model
      # whose graph carries it but never reads it sets this false in its ml_package file; the
      # node then binds a constant and subscribes to nothing.
      turn_indicators:
        enabled: true
      line_string_max_step_m: 5.0

    postprocess:
      velocity_smoothing_window: 8
      stopping_threshold: 0.3
      # Used only when the model's ml_package file names a turn_indicator tensor. A new state
      # must lead with at least min_probability for confirm_cycles consecutive cycles, and
      # hold_s must have passed since the last change.
      turn_indicator:
        min_probability: 0.7
        confirm_cycles: 1
        hold_s: 1.0

    # Stop and slow-down factors read off the published trajectory, the way
    # autoware_diffusion_planner reports them. Off by default: a stack that labels planning
    # factors downstream of the trajectory generator would otherwise report them twice.
    planning_factor:
      enable_stop: false
      enable_slowdown: false
      stop_velocity_threshold: 0.1
      stop_keep_duration_threshold: 1.0
      slowdown_accel_threshold: -0.3
